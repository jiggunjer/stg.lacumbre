# Cloudflare Worker: CMS auth API (Google OAuth → GitHub token for Sveltia).
# Public URL: https://stg-api.lacumbre.workers.dev

name = "stg-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "lacumbre-staging"

[vars]
R2_PUBLIC_URL = "https://pub-6d3b161212ba4abcb693d4a506465ce2.r2.dev"
R2_PREFIX = "cms-uploads/"
CMS_SITE_URL = "https://stg.lacumbre-villa.casa"

# Secrets (set via `npx wrangler secret put <NAME>`, never in this file):
#   GOOGLE_CLIENT_ID        – Google OAuth client ID
#   GOOGLE_CLIENT_SECRET    – Google OAuth client secret
#   ALLOWED_EMAILS          – comma-separated allowlist
#   GITHUB_PAT              – GitHub personal access token for Sveltia
#   SESSION_SECRET          – random string for signing asset-manager session cookies
