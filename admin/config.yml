backend:
  name: github
  repo: jiggunjer/stg.lacumbre
  branch: stg
  base_url: https://stg-api.lacumbre.workers.dev

# Internal defaults are still needed by the CMS UI,
# even when using external media providers.
media_folder: static/cms-media-local
public_folder: /cms-media-local

collections:
  - name: gallery
    label: Gallery
    files:
      - name: gallery_data
        label: Gallery Images
        file: data/gallery.json
        format: json
        fields:
          - label: Images
            name: images
            widget: list
            summary: "{{fields.order}} - {{fields.alt_en}}"
            hint: Order is manual for now; drag-and-drop is not yet available.
            fields:
              - label: Image
                name: src
                widget: image
                required: true
                choose_url: true
                hint: Open the Media Library from the editor, upload the image there, then paste the shareable link here.
              - label: Alt text (English)
                name: alt_en
                widget: string
                required: true
              - label: Alt text (Dutch)
                name: alt_nl
                widget: string
                required: true
              - label: Sort order
                name: order
                widget: number
                value_type: int
                min: 1
                required: true
              - label: Featured
                name: featured
                widget: boolean
                required: false
                default: false
  - name: videos
    label: Videos
    files:
      - name: videos_data
        label: Gallery Videos
        file: data/videos.json
        format: json
        fields:
          - label: Videos
            name: videos
            widget: list
            summary: "{{fields.order}} - {{fields.title_en}}"
            fields:
              - label: Type
                name: type
                widget: select
                required: false
                default: youtube
                options:
                  - label: YouTube video
                    value: youtube
                  - label: Live webcam embed
                    value: webcam
              - label: Video or source URL
                name: url
                widget: string
                required: true
                hint: Use a YouTube watch/share URL for YouTube entries, or the live player/source URL for a webcam asset.
              - label: Embed URL
                name: embed_url
                widget: string
                required: false
                hint: Optional for live webcams or custom players. Leave empty for standard YouTube videos.
              - label: Title (English)
                name: title_en
                widget: string
                required: true
              - label: Title (Dutch)
                name: title_nl
                widget: string
                required: true
              - label: Sort order
                name: order
                widget: number
                value_type: int
                min: 1
                required: true
