backend:
  name: github
  repo: jiggunjer/stg.lacumbre
  branch: stg
  base_url: https://stg-api.lacumbre.workers.dev

# Internal defaults are still needed by the CMS UI,
# even when using external media providers.
media_folder: static/cms-media-local
public_folder: /cms-media-local

collections:
  - name: gallery
    label: Gallery
    files:
      - name: gallery_data
        label: Gallery Images
        file: data/gallery.json
        format: json
        fields:
          - label: Images
            name: images
            widget: list
            summary: "{{fields.order}} - {{fields.alt_en}}"
            hint: Order is manual for now; drag-and-drop is not yet available.
            fields:
              - label: Asset
                name: src
                widget: image
                required: true
                choose_url: true
                hint: Upload images in the R2 Asset Manager (opens from /admin), then paste the public URL here.
              - label: Alt text (English)
                name: alt_en
                widget: string
                required: true
              - label: Alt text (Dutch)
                name: alt_nl
                widget: string
                required: true
              - label: Sort order
                name: order
                widget: number
                value_type: int
                min: 1
                required: true
              - label: Featured
                name: featured
                widget: boolean
                required: false
                default: false
  - name: videos
    label: Videos
    files:
      - name: videos_data
        label: YouTube Videos
        file: data/videos.json
        format: json
        fields:
          - label: Videos
            name: videos
            widget: list
            summary: "{{fields.order}} - {{fields.title_en}}"
            fields:
              - label: YouTube URL
                name: url
                widget: string
                required: true
              - label: Title (English)
                name: title_en
                widget: string
                required: true
              - label: Title (Dutch)
                name: title_nl
                widget: string
                required: true
              - label: Sort order
                name: order
                widget: number
                value_type: int
                min: 1
                required: true
